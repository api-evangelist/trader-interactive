apis:
  - aid: trader-interactive:tol-api
    name: TraderOnline (TOL) API
    description: >-
      The TraderOnline REST API is the integration surface behind Trader Interactive's marketplace
      network. It is an OAuth 2.0 protected, JSON, offset/limit paginated REST API served from
      api.traderonline.com. Trader Interactive does not publish a public reference or specification for
      it; the only public description of its wire contract is the source and README of the first-party
      PHP and Node.js clients the company maintains under github.com/traderinteractive.
    humanURL: https://github.com/traderinteractive/tol-api-php
    baseURL: https://api.traderonline.com

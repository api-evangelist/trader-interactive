aid: trader-interactive
name: Trader Interactive
description: >-
  Trader Interactive is a Norfolk, Virginia digital marketplace and dealer-services company operating a
  portfolio of vertical vehicle marketplaces — RV Trader, Cycle Trader, ATV Trader, PWC Trader, Snowmobile
  Trader, Aero Trader, Boatmart, Trade-A-Plane, Commercial Truck Trader, Equipment Trader, Next Truck,
  Rock & Dirt and Tradequip — alongside the Commercial Web Services and RV Web Services dealer website
  businesses and Statistical Surveys market research. It reaches over 13 million monthly unique visitors
  and has been wholly owned by CAR Group (formerly carsales.com Ltd) since 2022. Its integration surface
  is the TraderOnline (TOL) REST API, served from api.traderonline.com behind AWS API Gateway and consumed
  by dealers and syndication partners through first-party OAuth 2.0 client-credentials clients that Trader
  Interactive publishes as open source on GitHub, Packagist and npm. There is no public developer portal,
  no published API reference, and no machine-readable specification.
